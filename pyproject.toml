[project]
name = "motteavl"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "motte-contracts",
  "motte-sdk",
  "motte-provider",
  "motte-agent",
  "motte-harness",
  "motte-skill",
  "motte-sandbox",
  "motte-eval",
  "motte-trace",
  "motte-storage",
  "motte-cli",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
]

[tool.uv]
required-version = ">=0.11.6,<0.12"

[tool.uv.sources]
motte-contracts = {workspace = true}
motte-sdk = {workspace = true}
motte-provider = {workspace = true}
motte-agent = {workspace = true}
motte-harness = {workspace = true}
motte-skill = {workspace = true}
motte-sandbox = {workspace = true}
motte-eval = {workspace = true}
motte-trace = {workspace = true}
motte-storage = {workspace = true}
motte-cli = {workspace = true}

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
markers = ["replay: deterministic replay tests", "live: external provider tests"]
pythonpath = [
  ".",
  "packages/cli",
  "packages/contracts",
  "packages/sdk-python",
  "packages/provider-runtime",
  "packages/agent-runtime",
  "packages/harness-runtime",
  "packages/skill-runtime",
  "packages/sandbox",
  "packages/evaluators",
  "packages/trace",
  "packages/storage",
]

[tool.ruff]
line-length = 100
target-version = "py312"
lint.ignore = ["E401", "E402", "F401", "F403"]

[tool.mypy]
python_version = "3.12"
strict = true
