[project]
name = "motteavl"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "motte-contracts",
  "motte-sdk",
  "motte-provider",
  "motte-agent",
  "motte-harness",
  "motte-skill",
  "motte-sandbox",
  "motte-eval",
  "motte-trace",
  "motte-storage",
  "motte-cli",
  "motte-benchmark-runtime",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
  "celery>=5.4,<6",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "docker>=7,<8",
  "jsonschema>=4.23,<5",
]

[tool.uv]
required-version = ">=0.11.6,<0.13"

[dependency-groups]
dev = ["pytest>=9.0.3,<10", "mypy>=1.13,<2", "pip-audit>=2.7,<3", "ruff>=0.14.11,<0.15"]

[tool.uv.sources]
motte-contracts = {workspace = true}
motte-sdk = {workspace = true}
motte-provider = {workspace = true}
motte-agent = {workspace = true}
motte-harness = {workspace = true}
motte-skill = {workspace = true}
motte-sandbox = {workspace = true}
motte-eval = {workspace = true}
motte-trace = {workspace = true}
motte-storage = {workspace = true}
motte-cli = {workspace = true}
motte-benchmark-runtime = {workspace = true}

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
markers = ["replay: deterministic replay tests", "live: external provider tests"]
pythonpath = [
  ".",
  "packages/cli",
  "packages/contracts",
  "packages/sdk-python",
  "packages/provider-runtime",
  "packages/agent-runtime",
  "packages/harness-runtime",
  "packages/skill-runtime",
  "packages/sandbox",
  "packages/evaluators",
  "packages/trace",
  "packages/storage",
  "packages/benchmark-runtime",
]

[tool.ruff]
line-length = 100
target-version = "py312"
lint.ignore = ["E401", "E402", "F401", "F403"]

[tool.mypy]
python_version = "3.12"
strict = true
# 分期启用：阶段 6 起 CI 只对 contracts 运行 strict；
# 其余包（sdk/storage/provider 等）待逐包清零后加入 CI 命令。
