name: CI
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: motteavl
          POSTGRES_PASSWORD: motteavl
          POSTGRES_DB: motteavl
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U motteavl -d motteavl"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      MOTTE_PG_DSN: postgresql://motteavl:motteavl@localhost:5432/motteavl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest -q -m "not live"
      - run: uv run ruff check .
      - run: uv run mypy packages/contracts
      - run: uv run pip-audit --skip-editable
      - run: uv run python -m compileall -q packages apps
      - run: docker compose -f infra/docker-compose.yml config -q
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra/docker-compose.yml
      - name: openapi 无漂移
        run: |
          uv run python -c "import json; from apps.api.app.main import app; open('api/openapi.json.new', 'w', encoding='utf-8').write(json.dumps(app.openapi(), ensure_ascii=False, indent=2, sort_keys=True) + '\n')"
          diff api/openapi.json api/openapi.json.new
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: '9.15.0'}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web build
      - run: pnpm -r test
      - run: pnpm --dir apps/web audit --audit-level high
      - name: TypeScript API 类型无漂移
        run: |
          pnpm --dir apps/web gen:api
          git diff --exit-code apps/web/src/api/schema.d.ts
