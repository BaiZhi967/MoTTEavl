name: CI
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: motteavl
          POSTGRES_PASSWORD: motteavl
          POSTGRES_DB: motteavl
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U motteavl -d motteavl"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      MOTTE_PG_DSN: postgresql://motteavl:motteavl@localhost:5432/motteavl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest -q -m "not live"
      - run: uv run ruff check .
      - run: uv run python -m compileall -q packages apps
      - run: docker compose -f infra/docker-compose.yml config -q
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: '9.15.0'}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web build
      - run: pnpm -r test
