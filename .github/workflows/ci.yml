name: CI
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: motteavl
          POSTGRES_PASSWORD: motteavl
          POSTGRES_DB: motteavl
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U motteavl -d motteavl"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      MOTTE_PG_DSN: postgresql://motteavl:motteavl@localhost:5432/motteavl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with: {version: '9.15.0'}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: uv sync
      - run: pnpm install --frozen-lockfile
      - run: make check
      - name: M8 isolated PostgreSQL allocation and restore receipts
        run: >-
          uv run pytest -vv
          tests/storage/test_m8_experiment_pg_concurrency.py::test_two_postgres_processes_do_not_reclaim_active_cell
          tests/integration/test_m8_pg_restore.py::test_pg_dump_restore_preserves_run_trial_pass_baseline_and_artifact
      - name: M8 isolated PostgreSQL Trace retention transactions
        run: >-
          uv run pytest -vv
          tests/storage/test_trace_retention_transactions.py
          tests/storage/test_trace_retention_pg.py
      - run: uv run pip-audit --skip-editable
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra/docker-compose.yml
      - name: openapi 无漂移
        run: uv run python scripts/check_openapi.py
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: '9.15.0'}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web build
      - run: pnpm -r test
      - run: pnpm --dir apps/web audit --audit-level high
      - name: TypeScript API 类型无漂移
        run: |
          pnpm --dir apps/web gen:api
          git diff --exit-code apps/web/src/api/schema.d.ts
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: make wheels
      - name: clean venv wheel 安装冒烟（checkout 外，无 PYTHONPATH）
        run: |
          VENV_DIR="$(mktemp -d)/venv"
          python -m venv "$VENV_DIR"
          "$VENV_DIR/bin/pip" install dist/*.whl
          WORK_DIR="$(mktemp -d)"
          cd "$WORK_DIR"
          "$VENV_DIR/bin/python" -c "import motte_sdk; from motte_sdk import MotteClient; print(motte_sdk.__file__)"
          "$VENV_DIR/bin/python" -m motte_cli --help

  windows-artifacts:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      MOTTE_REQUIRE_WINDOWS_ARTIFACT_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Native NTFS artifact safety and ordinary compatibility
        run: >-
          uv run pytest -q -rA
          tests/storage/test_artifacts.py
          tests/storage/test_windows_artifact_io.py

  compose-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Real shipped image, migration, API, Worker and restart acceptance
        timeout-minutes: 15
        run: python scripts/compose_acceptance.py
      - name: Retry owned-resource cleanup even after timeout or cancellation
        if: always()
        timeout-minutes: 5
        run: python scripts/compose_acceptance.py --cleanup-only
      - name: Compose logs and exact-SHA acceptance receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-acceptance-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            var/m8-compose-acceptance/receipt.json
            var/m8-compose-acceptance/commands.log
            var/m8-compose-acceptance/compose.json
            var/m8-compose-acceptance/effective-compose.json
            var/m8-compose-acceptance/fixed-pass-report.json
          if-no-files-found: error
          retention-days: 7
