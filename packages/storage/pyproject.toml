[project]
name = "motte-storage"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "motte-contracts",
]

[project.optional-dependencies]
# PostgreSQL 后端及迁移栈可选：默认安装（SQLite）不需要这些依赖（G09）。
postgresql = ["psycopg[binary]>=3", "alembic>=1.13,<2", "sqlalchemy>=2.0,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["motte_storage"]
